name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix web install --no-audit --no-fund
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - run: docker build -t clist:ci .
      - run: docker run -d --name clist-ci -p 8080:8080 -v clist_ci_data:/data clist:ci
      - run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test tests/full-flow.spec.ts --project=chromium --project=mobile
        working-directory: web
      - if: always()
        run: docker rm -f clist-ci || true
