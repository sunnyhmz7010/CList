name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix web install --no-package-lock --no-audit --no-fund
      - run: npm --prefix web test -- --run src
      - run: npm --prefix web run build
