services:
  clist:
    image: ghcr.io/sunnyhmz7010/clist:latest
    container_name: clist
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - clist_data:/data
    healthcheck:
      test: ["CMD", "/app/clist", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  clist_data:
